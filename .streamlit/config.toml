# web_demo/.streamlit/config.toml
# Streamlit configuration for the PUBLIC demo.
#
# IMPORTANT: do NOT hardcode server.address / server.port here.
# Streamlit Community Cloud runs the app on its own default port (8501) and
# health-checks 127.0.0.1:8501. Forcing a port (e.g. 7860) makes the app bind
# the wrong port and the platform health check fails ("connection refused").
# For Docker/HF the port is set via CLI flags in the Dockerfile CMD instead.
# For local runs: streamlit run app.py  (default port 8501)

[server]
headless = true
# Disable the local-source file watcher (also avoids noisy transformers
# introspection tracebacks on startup).
fileWatcherType = "none"
# Keep the upload guard tight; application-level checks enforce the real
# per-file limit, this is a coarse outer bound (MB).
maxUploadSize = 15
# XSRF protection stays ON. HF serves each Space on its own subdomain, so the
# default same-origin XSRF/CORS behavior works without relaxation.
enableXsrfProtection = true
enableCORS = true

[browser]
# No usage stats collection.
gatherUsageStats = false

[client]
# Never surface Python tracebacks / internal details to public users.
showErrorDetails = false
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#c9a24b"
backgroundColor = "#f5f1e6"
secondaryBackgroundColor = "#fbf9f2"
textColor = "#1c2733"
